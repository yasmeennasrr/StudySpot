name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, architecture, tests, migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: studyspot
          POSTGRES_PASSWORD: studyspot
          POSTGRES_DB: studyspot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U studyspot"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://studyspot:studyspot@localhost:5432/studyspot_test
      SCHEDULER_ENABLED: 'false'
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Architecture rules (module boundaries, no cycles)
        run: npm run deps:check
      - name: Validate API contract
        run: npm run contract:check
      - name: Unit and API-layer tests with coverage
        run: npm run test:cov
      - name: Test case sheet (IDs unique, linked to requirements and to test code)
        run: node ../scripts/traceability.mjs --check
      - name: Migrations apply, revert and match the entities
        run: |
          npm run migration:run
          npm run migration:revert
          npm run migration:run
          if npm run typeorm -- migration:generate src/db/migrations/Drift 2>&1 | grep -q "No changes"; then echo "Schema matches entities"; else echo "::error::Entities and migrations differ. Run npm run migration:generate"; exit 1; fi
      - name: Integration tests (real Postgres + PostGIS)
        run: npm run test:int
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/lcov-report

  app:
    name: Flutter app (analyze, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Check for the Flutter project
        id: has_app
        working-directory: .
        run: echo "present=$([ -f app/pubspec.yaml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        if: steps.has_app.outputs.present == 'true'
        with:
          channel: stable
          cache: true
      - if: steps.has_app.outputs.present == 'true'
        run: flutter pub get
      - if: steps.has_app.outputs.present == 'true'
        run: flutter analyze
      - if: steps.has_app.outputs.present == 'true'
        run: flutter test --coverage
      - if: steps.has_app.outputs.present != 'true'
        working-directory: .
        run: echo "No app/pubspec.yaml yet (M5 creates the Flutter project). Skipping."
